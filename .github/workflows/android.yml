name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  BuildDebug:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Replace LWJGL with 3.3.3
        run: |
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path

          version = "3.3.3"
          base = "https://repo1.maven.org/maven2/org/lwjgl/"

          libs = [
              "lwjgl",
              "lwjgl-glfw",
              "lwjgl-jemalloc",
              "lwjgl-openal",
              "lwjgl-opengl",
              "lwjgl-stb",
              "lwjgl-tinyfd",
              "lwjgl-freetype",
              "lwjgl-nanovg",
          ]

          dest = Path("jre_lwjgl3glfw/libs")
          dest.mkdir(parents=True, exist_ok=True)

          for lib in libs:
              url = f"{base}{lib}/{version}/{lib}-{version}.jar"
              output = dest / f"{lib}.jar"
              print(f"Baixando {url}")
              urllib.request.urlretrieve(url, output)

          PY

          chmod +x gradlew
          mkdir -p out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Debug ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ matrix.arch }}

      - name: Upload Debug ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-Debug-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*